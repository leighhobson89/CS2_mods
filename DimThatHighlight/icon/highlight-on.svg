<?xml version="1.0" encoding="UTF-8"?>
<!--
  Selected state — the panel is open.

  Same drawing at full intensity and thickened, with the core dropped to #141b22 —
  the near-black vanilla itself switches to on a selected control
  (--selectedTextColor). The selected button background is the palest blue in the
  accent ramp (#9ee2fc), which is where a dark, heavy glyph reads best; the weight is
  what says "on", since the strokes are already at full intensity on hover.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px" viewBox="0 0 64 64" version="1.1">
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="4.4">
    <!-- red, full intensity -->
    <path stroke="#f22d1e" d="M 12.5 8.5 L 33.5 6.5 L 55.5 10.5 L 57.5 32 L 54.5 54.5 L 32 57.5 L 10.5 53.5 L 6.5 31 Z"/>
    <!-- magenta, full intensity -->
    <path stroke="#e81ea6" d="M 16 13.5 L 33 11.5 L 50.5 15 L 52.5 32 L 50 50 L 32 52.5 L 14.5 49 L 11.5 31.5 Z"/>
    <!-- yellow, full intensity -->
    <path stroke="#ffcc00" d="M 20 19 L 32.5 17 L 45 20 L 47 32 L 45 45 L 32 47.5 L 19 44.5 L 17 31.5 Z"/>
  </g>
  <path fill="#141b22" d="M 25 25.5 L 33 23.5 L 40.5 26 L 42 32 L 40 39.5 L 32 41.5 L 24.5 39 L 23.5 31.5 Z"/>
</svg>
